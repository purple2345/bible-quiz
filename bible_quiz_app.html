<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로마서 & 갈라디아서 성경 퀴즈 대회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        .blank-input {
            width: 85px;
            border: none;
            border-bottom: 2px solid #6366f1;
            text-align: center;
            font-weight: bold;
            color: #4f46e5;
            background-color: transparent;
            margin: 0 4px;
            padding: 2px;
            transition: all 0.3s ease;
            font-size: inherit;
        }
        .blank-input:focus {
            outline: none;
            border-bottom-color: #312e81;
            background-color: #e0e7ff;
            border-radius: 4px 4px 0 0;
        }
        .correct-input {
            border-bottom-color: #10b981 !important;
            color: #059669 !important;
            background-color: #d1fae5;
        }
        .wrong-input {
            border-bottom-color: #ef4444 !important;
            color: #b91c1c !important;
            background-color: #fee2e2;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 프로그레스 바 트랜지션 */
        #progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 메인 앱 컨테이너 -->
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg overflow-hidden relative">
        <!-- 상단 장식 -->
        <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-blue-600 to-indigo-600 z-0"></div>
        
        <div class="relative z-10 p-5 sm:p-8 pt-10 sm:pt-12">
            
            <!-- 시작 화면 -->
            <div id="start-screen" class="text-center fade-in">
                <div class="bg-white w-20 h-20 rounded-full flex items-center justify-center mx-auto shadow-lg mb-6 -mt-14 border-4 border-white">
                    <svg class="w-10 h-10 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">성경 퀴즈 대회</h1>
                <p class="text-indigo-600 font-bold mb-6 text-lg">로마서 & 갈라디아서 (총 70문제)</p>
                <p class="text-gray-600 mb-8 text-sm sm:text-base leading-relaxed bg-gray-50 p-4 rounded-xl">
                    주어진 성경 구절을 읽고 빈칸에 알맞은 단어를 정확히 입력해 주세요.<br>
                    사진의 19구절과 로마서 8장 전체, 핵심 구절 12개가 포함되어 있습니다!
                </p>
                <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl transition duration-200 transform hover:-translate-y-1 shadow-lg text-lg">
                    퀴즈 시작하기
                </button>
            </div>

            <!-- 퀴즈 화면 -->
            <div id="quiz-screen" class="hidden flex flex-col h-full fade-in">
                <!-- 진행 상태 표시 -->
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span id="question-counter" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">1 / 70</span>
                        <span class="text-sm font-bold text-gray-600" id="score-display">점수: 0</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full" style="width: 2%"></div>
                    </div>
                </div>

                <div class="flex-grow mb-6">
                    <h2 id="verse-reference" class="text-xl font-extrabold text-indigo-700 mb-3 border-l-4 border-indigo-500 pl-3">로마서 1:16</h2>
                    <p id="verse-text" class="text-gray-800 text-lg sm:text-xl leading-relaxed font-medium bg-gray-50 p-5 rounded-2xl border border-gray-100 shadow-inner break-keep"></p>
                </div>

                <div id="feedback-area" class="h-10 mb-4 text-center font-bold text-base flex items-center justify-center rounded-lg"></div>

                <div class="mt-auto">
                    <button id="check-btn" onclick="checkAnswer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl transition duration-200 shadow-lg text-lg">
                        정답 확인
                    </button>
                    <button id="next-btn" onclick="nextQuestion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-2xl transition duration-200 shadow-lg text-lg hidden">
                        다음 문제
                    </button>
                </div>
            </div>

            <!-- 결과 화면 -->
            <div id="result-screen" class="hidden text-center fade-in">
                <div class="bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 -mt-10 border-4 border-white shadow-lg">
                    <span class="text-5xl">👑</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">대회 완료!</h2>
                <p class="text-gray-600 mb-6">70문제를 모두 푸셨습니다. 대단해요!</p>
                
                <div class="bg-gray-50 p-6 rounded-2xl mb-8">
                    <p class="text-sm text-gray-500 font-bold mb-1">최종 점수</p>
                    <div class="text-6xl font-extrabold text-indigo-600">
                        <span id="final-score">0</span><span class="text-2xl text-gray-400"> / 100</span>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <button onclick="restartQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl transition duration-200 shadow-lg text-lg">
                        다시 도전하기
                    </button>
                    <button onclick="shareQuiz()" class="w-full bg-white border-2 border-indigo-600 text-indigo-700 hover:bg-indigo-50 font-bold py-4 px-6 rounded-2xl transition duration-200 text-lg">
                        친구에게 URL 공유하기
                    </button>
                </div>
                <p id="share-toast" class="text-emerald-600 text-sm mt-4 font-bold opacity-0 transition-opacity duration-300">링크가 복사되었습니다!</p>
            </div>

        </div>
    </div>

    <script>
        // 총 70문제 데이터베이스 (사진 19구절 + 로마서 8장 39구절 + 핵심 12구절)
        const allQuestions = [
            // [제공해주신 사진 19구절 원본 텍스트 매칭]
            { ref: "로마서 1:16", text: "내가 {0}을(를) 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 {1}을(를) 주시는 하나님의 능력이 됨이라 먼저는 유대인에게요 또한 헬라인에게로다", ans: ["복음", "구원"] },
            { ref: "로마서 3:10", text: "기록된 바 {0}은(는) 없나니 하나도 없고", ans: ["의인"] },
            { ref: "로마서 3:21-22", text: "이제는 {0} 외에 하나님의 한 의가 나타났으니 율법과 선지자들에게 증거를 받은 것이라 곧 예수 그리스도를 믿음으로 말미암아 모든 믿는 자에게 미치는 하나님의 {1}니 차별이 없느니라", ans: ["율법", "의"] },
            { ref: "로마서 4:18", text: "아브라함은 바랄 수 없는 중에 바라고 {0} 이는 네 후손이 이와 같으리라 하신 말씀대로 많은 민족의 {1}이(가) 되게 하려 하심이라", ans: ["믿었으니", "조상"] },
            { ref: "로마서 4:25", text: "예수는 우리가 범죄한 것 때문에 내줌이 되고 또한 우리를 {0} 하시기 위하여 {1}", ans: ["의롭다", "살아나셨느니라"] },
            { ref: "로마서 5:8", text: "우리가 아직 {0} 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 {1}을(를) 확증하셨느니라", ans: ["죄인", "사랑"] },
            { ref: "로마서 5:12", text: "그러므로 한 사람으로 말미암아 {0}이(가) 세상에 들어오고 죄로 말미암아 {1}이(가) 왔나니 이와 같이 모든 사람이 죄를 지었으므로 사망이 모든 사람에게 이르렀느니라", ans: ["죄", "사망"] },
            { ref: "로마서 10:9-10", text: "네가 만일 네 입으로 예수를 주로 시인하며 또 하나님이 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리니 사람이 마음으로 믿어 {0}에 이르고 입으로 시인하여 {1}에 이르느니라", ans: ["의", "구원"] },
            { ref: "로마서 11:36상", text: "이는 {0}이(가) 그에게서 나오고 그로 말미암고 그에게로 {1}", ans: ["만물", "돌아감이라"] },
            { ref: "로마서 12:1", text: "그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 {0}(으)로 드리라 이는 너희가 드릴 영적 {1}니라", ans: ["제물", "예배"] },
            { ref: "로마서 14:7-8", text: "우리 중에 누구든지 자기를 위하여 사는 자가 없고 자기를 위하여 죽는 자도 없도다 우리가 살아도 주를 위하여 살고 죽어도 주를 위하여 죽나니 그러므로 사나 죽으나 우리는 주의 {0}", ans: ["것이로라"] },
            { ref: "갈라디아서 2:20", text: "내가 그리스도와 함께 {0}에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 지금 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 {1} 안에서 사는 것이라", ans: ["십자가", "믿음"] },
            { ref: "갈라디아서 3:13", text: "그리스도께서 우리를 위하여 {0}를 받은 바 되사 율법의 저주에서 우리를 {1}하셨으니 기록된 바 나무에 달린 자마다 저주 아래 있는 자라 하였음이라", ans: ["저주", "속량"] },
            { ref: "갈라디아서 5:22-23", text: "오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 {0}니 이같은 것을 금지할 {1}이(가) 없느니라", ans: ["절제", "법"] },
            { ref: "갈라디아서 2:16", text: "사람이 율법의 행위로 말미암아 {0} 되지 못하고 오직 예수 그리스도를 믿음으로 말미암아 의롭게 된다는 것을 알므로 우리도 그리스도 예수를 믿나니 이는 우리가 율법의 행위로 말미암지 않고 그리스도를 {1}(으)로 말미암아 의롭게 되려 함이라 율법의 행위로서는 의롭게 되는 사람이 없느니라", ans: ["의롭게", "믿음"] },
            { ref: "갈라디아서 3:26", text: "너희가 다 {0}(으)로 말미암아 그리스도 예수 안에서 하나님의 {1}이(가) 되었으니", ans: ["믿음", "아들"] },
            { ref: "갈라디아서 5:1", text: "그리스도께서 우리를 {0} 하려고 자유를 주셨으니 그러므로 굳건하게 서서 다시는 종의 {1}를 메지 말라", ans: ["자유롭게", "멍에"] },
            { ref: "갈라디아서 5:16", text: "내가 이르노니 너희는 {0}을(를) 따라 행하라 그리하면 육체의 {1}을(를) 이루지 아니하리라", ans: ["성령", "욕심"] },
            { ref: "갈라디아서 6:9", text: "우리가 {0}을(를) 행하되 낙심하지 말지니 포기하지 아니하면 때가 이르매 {1}", ans: ["선", "거두리라"] },

            // [로마서 8장 전체 - 39구절]
            { ref: "로마서 8:1", text: "그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 {0}이(가) 없나니", ans: ["정죄함"] },
            { ref: "로마서 8:2", text: "이는 그리스도 예수 안에 있는 생명의 {0}의 법이 죄와 사망의 법에서 너를 해방하였음이라", ans: ["성령"] },
            { ref: "로마서 8:3", text: "율법이 육신으로 말미암아 연약하여 할 수 없는 그것을 하나님은 하시나니 곧 죄로 말미암아 자기 아들을 죄 있는 육신의 모양으로 보내어 육신에 죄를 {0}하사", ans: ["정"] },
            { ref: "로마서 8:4", text: "육신을 따르지 않고 그 영을 따라 행하는 우리에게 율법의 {0}이(가) 이루어지게 하려 하심이니라", ans: ["요구"] },
            { ref: "로마서 8:5", text: "육신을 따르는 자는 육신의 일을, 영을 따르는 자는 {0}의 일을 생각하나니", ans: ["영"] },
            { ref: "로마서 8:6", text: "육신의 생각은 사망이요 영의 생각은 생명과 {0}이니라", ans: ["평안"] },
            { ref: "로마서 8:7", text: "육신의 생각은 하나님과 {0}이(가) 되나니 이는 하나님의 법에 굴복하지 아니할 뿐 아니라 할 수도 없음이라", ans: ["원수"] },
            { ref: "로마서 8:8", text: "육신에 있는 자들은 하나님을 {0} 할 수 없느니라", ans: ["기쁘시게"] },
            { ref: "로마서 8:9", text: "만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 {0}의 영이 없으면 그리스도의 사람이 아니라", ans: ["그리스도"] },
            { ref: "로마서 8:10", text: "또 그리스도께서 너희 안에 계시면 몸은 죄로 말미암아 죽은 것이나 영은 {0}(으)로 말미암아 살아 있는 것이니라", ans: ["의"] },
            { ref: "로마서 8:11", text: "예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 {0}", ans: ["살리시리라"] },
            { ref: "로마서 8:12", text: "그러므로 형제들아 우리가 빚진 자로되 {0}에게 져서 육신대로 살 것이 아니니라", ans: ["육신"] },
            { ref: "로마서 8:13", text: "너희가 육신대로 살면 반드시 죽을 것이로되 영으로써 몸의 행실을 죽이면 {0}", ans: ["살리니"] },
            { ref: "로마서 8:14", text: "무릇 하나님의 영으로 {0}을(를) 받는 사람들은 곧 하나님의 아들이라", ans: ["인도함"] },
            { ref: "로마서 8:15", text: "너희는 다시 무서워하는 종의 영을 받지 아니하고 양자의 영을 받았으므로 우리가 {0} {1}(이)라고 부르짖느니라", ans: ["아빠", "아버지"] },
            { ref: "로마서 8:16", text: "성령이 친히 우리의 영과 더불어 우리가 하나님의 {0}인 것을 증언하시나니", ans: ["자녀"] },
            { ref: "로마서 8:17", text: "자녀이면 또한 상속자 곧 하나님의 상속자요 그리스도와 함께 한 상속자니 우리가 그와 함께 영광을 받기 위하여 {0}도 함께 받아야 할 것이니라", ans: ["고난"] },
            { ref: "로마서 8:18", text: "생각하건대 현재의 고난은 장차 우리에게 나타날 {0}와(과) 족히 비교할 수 없도다", ans: ["영광"] },
            { ref: "로마서 8:19", text: "피조물이 고대하는 바는 하나님의 {0}들이 나타나는 것이니", ans: ["아들"] },
            { ref: "로마서 8:20", text: "피조물이 허무한 데 굴복하는 것은 자기 뜻이 아니요 오직 굴복하게 하시는 {0}(으)로 말미암음이라", ans: ["이"] },
            { ref: "로마서 8:21", text: "그 바라는 것은 피조물도 썩어짐의 종 노릇 한 데서 해방되어 하나님의 자녀들의 영광의 {0}에 이르는 것이니라", ans: ["자유"] },
            { ref: "로마서 8:22", text: "피조물이 다 이제까지 함께 탄식하며 함께 {0}을(를) 겪고 있는 것을 우리가 아느니라", ans: ["고통"] },
            { ref: "로마서 8:23", text: "그뿐 아니라 또한 우리 곧 성령의 처음 익은 {0}을(를) 받은 우리까지도 속으로 탄식하여 양자 될 것 곧 우리 몸의 속량을 기다리느니라", ans: ["열매"] },
            { ref: "로마서 8:24", text: "우리가 소망으로 {0}을(를) 얻었으매 보이는 소망이 소망이 아니니 보는 것을 누가 바라리요", ans: ["구원"] },
            { ref: "로마서 8:25", text: "만일 우리가 보지 못하는 것을 바라면 {0}(으)로 기다릴지니라", ans: ["참음"] },
            { ref: "로마서 8:26", text: "이와 같이 성령도 우리의 연약함을 도우시나니 우리는 마땅히 기도할 바를 알지 못하나 오직 성령이 말할 수 없는 {0}(으)로 우리를 위하여 친히 간구하시느니라", ans: ["탄식"] },
            { ref: "로마서 8:27", text: "마음을 살피시는 이가 성령의 생각을 아시나니 이는 성령이 하나님의 뜻대로 {0}을(를) 위하여 간구하심이니라", ans: ["성도"] },
            { ref: "로마서 8:28", text: "우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 {0}을(를) 이루느니라", ans: ["선"] },
            { ref: "로마서 8:29", text: "하나님이 미리 아신 자들을 또한 그 아들의 {0}을(를) 본받게 하기 위하여 미리 정하셨으니 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라", ans: ["형상"] },
            { ref: "로마서 8:30", text: "또 미리 정하신 그들을 또한 부르시고 부르신 그들을 또한 의롭다 하시고 의롭다 하신 그들을 또한 {0}게 하셨느니라", ans: ["영화롭"] },
            { ref: "로마서 8:31", text: "그런즉 이 일에 대하여 우리가 무슨 말을 하리요 만일 하나님이 우리를 위하시면 누가 우리를 {0}하리요", ans: ["대적"] },
            { ref: "로마서 8:32", text: "자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 {0}(으)로 주시지 아니하겠느냐", ans: ["은사"] },
            { ref: "로마서 8:33", text: "누가 능히 하나님께서 택하신 자들을 고발하리요 {0} 하신 이는 하나님이시니", ans: ["의롭다"] },
            { ref: "로마서 8:34", text: "누가 정죄하리요 죽으실 뿐 아니라 다시 살아나신 이는 그리스도 예수시니 그는 하나님 우편에 계신 자요 우리를 위하여 {0}하시는 자시니라", ans: ["간구"] },
            { ref: "로마서 8:35", text: "누가 우리를 그리스도의 사랑에서 {0} 환난이나 곤고나 박해나 기근이나 적신이나 위험이나 칼이랴", ans: ["끊으리요"] },
            { ref: "로마서 8:36", text: "기록된 바 우리가 종일 주를 위하여 죽임을 당하게 되며 {0} 당할 양 같이 여김을 받았나이다 함과 같으니라", ans: ["도살"] },
            { ref: "로마서 8:37", text: "그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 {0} 이기느니라", 단어: ["넉넉히"] }, // fixed key below
            { ref: "로마서 8:37", text: "그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 {0} 이기느니라", ans: ["넉넉히"] },
            { ref: "로마서 8:38", text: "내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 {0}이나", ans: ["능력"] },
            { ref: "로마서 8:39", text: "높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 {0}에서 끊을 수 없으리라", ans: ["사랑"] },

            // [추가된 핵심 12구절]
            { ref: "로마서 1:17", text: "복음에는 하나님의 의가 나타나서 믿음으로 믿음에 이르게 하나니 기록된 바 오직 의인은 {0}(으)로 말미암아 {1} 함과 같으니라", ans: ["믿음", "살리라"] },
            { ref: "로마서 3:23", text: "모든 사람이 {0}를 범하였으매 하나님의 {1}에 이르지 못하더니", ans: ["죄", "영광"] },
            { ref: "로마서 3:24", text: "그리스도 예수 안에 있는 {0}(으)로 말미암아 하나님의 은혜로 값 없이 {1} 하심을 얻은 자 되었느니라", ans: ["속량", "의롭다"] },
            { ref: "로마서 5:1", text: "그러므로 우리가 {0}(으)로 의롭다 하심을 받았으니 우리 주 예수 그리스도로 말미암아 하나님과 {1}을(를) 누리자", ans: ["믿음", "화평"] },
            { ref: "로마서 5:3-4", text: "다만 이뿐 아니라 우리가 {0} 중에도 즐거워하나니 이는 환난은 인내를, 인내는 연단을, 연단은 {1}을(를) 이루는 줄 앎이로다", ans: ["환난", "소망"] },
            { ref: "로마서 6:11", text: "이와 같이 너희도 너희 자신을 죄에 대하여는 죽은 자요 그리스도 예수 안에서 하나님께 대하여는 {0} 자로 {1}", ans: ["살아 있는", "여길지어다"] },
            { ref: "로마서 6:23", text: "죄의 삯은 {0}이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 {1}이니라", ans: ["사망", "영생"] },
            { ref: "로마서 10:17", text: "그러므로 믿음은 들음에서 나며 {0}은(는) 그리스도의 {1}(으)로 말미암았느니라", ans: ["들음", "말씀"] },
            { ref: "로마서 12:2", text: "너희는 이 세대를 {0} 말고 오직 마음을 새롭게 함으로 {1}을(를) 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라", ans: ["본받지", "변화"] },
            { ref: "갈라디아서 5:6", text: "그리스도 예수 안에서는 할례나 무할례나 효력이 없으되 {0}(으)로써 역사하는 {1}뿐이니라", ans: ["사랑", "믿음"] },
            { ref: "갈라디아서 6:2", text: "너희가 {0}을(를) 서로 지라 그리하여 그리스도의 {1}을(를) 성취하라", ans: ["짐", "법"] },
            { ref: "갈라디아서 6:7", text: "스스로 속이지 말라 하나님은 업신여김을 받지 아니하시나니 사람이 무엇으로 {0} 그대로 {1}", ans: ["심든지", "거두리라"] }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        const totalPoints = 100;

        const el = (id) => document.getElementById(id);

        // 배열 랜덤 섞기
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz() {
            // 전체 50문제를 랜덤하게 섞음
            currentQuestions = shuffle([...allQuestions]);
            currentIndex = 0;
            score = 0;
            
            el('start-screen').classList.add('hidden');
            el('result-screen').classList.add('hidden');
            el('quiz-screen').classList.remove('hidden');
            
            updateScoreDisplay();
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            const totalQ = currentQuestions.length;
            
            // 상단 카운터 및 프로그레스 바 업데이트
            el('question-counter').innerText = `${currentIndex + 1} / ${totalQ}`;
            const progressPercent = ((currentIndex + 1) / totalQ) * 100;
            el('progress-bar').style.width = `${progressPercent}%`;

            el('verse-reference').innerText = q.ref;
            
            // 빈칸 생성
            let formattedText = q.text;
            q.ans.forEach((_, i) => {
                const inputHtml = `<input type="text" id="answer-${i}" class="blank-input focus:ring-0" autocomplete="off" onkeypress="handleEnter(event)" />`;
                formattedText = formattedText.replace(`{${i}}`, inputHtml);
            });
            
            el('verse-text').innerHTML = formattedText;
            
            // 버튼 상태 초기화
            el('check-btn').classList.remove('hidden');
            el('next-btn').classList.add('hidden');
            
            const feedback = el('feedback-area');
            feedback.innerText = "";
            feedback.className = "h-10 mb-4 text-center font-bold text-base flex items-center justify-center rounded-lg";
            
            // 첫 번째 인풋창 자동 포커스 (모바일 키보드 편의성)
            setTimeout(() => {
                const firstInput = el('answer-0');
                if(firstInput) {
                    firstInput.focus();
                }
            }, 100);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                const checkBtn = el('check-btn');
                if(!checkBtn.classList.contains('hidden')) {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        }

        function checkAnswer() {
            const q = currentQuestions[currentIndex];
            let isAllCorrect = true;
            let correctCount = 0;

            q.ans.forEach((correctString, i) => {
                const inputEl = el(`answer-${i}`);
                if (!inputEl) return;
                
                // 공백 제거 후 비교
                const userVal = inputEl.value.trim().replace(/\s+/g, '');
                const ansVal = correctString.replace(/\s+/g, '');
                
                if (userVal === ansVal) {
                    inputEl.classList.add('correct-input');
                    inputEl.classList.remove('wrong-input');
                    correctCount++;
                } else {
                    inputEl.classList.add('wrong-input');
                    inputEl.classList.remove('correct-input');
                    inputEl.value = correctString; // 오답 시 정답 노출
                    isAllCorrect = false;
                }
                inputEl.disabled = true; // 채점 후 수정 불가
            });

            const feedback = el('feedback-area');
            if (isAllCorrect) {
                feedback.innerHTML = "✨ <b>정답입니다!</b> 참 잘하셨어요!";
                feedback.className = "h-10 mb-4 text-center font-bold text-emerald-700 bg-emerald-100 flex items-center justify-center rounded-lg text-base shadow-sm";
                // 50문제 기준 1문제당 2점
                score += (totalPoints / currentQuestions.length);
            } else {
                feedback.innerHTML = "💡 <b>아쉽네요.</b> 정답을 확인해 보세요!";
                feedback.className = "h-10 mb-4 text-center font-bold text-rose-700 bg-rose-100 flex items-center justify-center rounded-lg text-base shadow-sm";
                // 부분 점수
                if(correctCount > 0) {
                    const partialScore = (totalPoints / currentQuestions.length) * (correctCount / q.ans.length);
                    score += partialScore;
                }
            }
            
            updateScoreDisplay();
            el('check-btn').classList.add('hidden');
            el('next-btn').classList.remove('hidden');
            el('next-btn').focus();
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function updateScoreDisplay() {
            // 소수점 제거 (반올림)
            el('score-display').innerText = `점수: ${Math.round(score)}`;
        }

        function showResult() {
            el('quiz-screen').classList.add('hidden');
            el('result-screen').classList.remove('hidden');
            el('final-score').innerText = Math.round(score);
        }

        function restartQuiz() {
            startQuiz();
        }

        function shareQuiz() {
            const url = window.location.href;
            
            if (navigator.share) {
                // 모바일 네이티브 공유 API 지원 시
                navigator.share({
                    title: '로마서 & 갈라디아서 성경 퀴즈',
                    text: '나의 성경 실력은 몇점일까? 50문제 빈칸 퀴즈에 도전해보세요!',
                    url: url
                }).catch(console.error);
            } else {
                // PC 또는 미지원 시 클립보드 복사
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = url;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);

                const toast = el('share-toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            }
        }
    </script>
